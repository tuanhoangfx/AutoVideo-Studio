<!doctype html>
<html lang="en" class="theme-hub h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=80186ab5" />
    <link rel="apple-touch-icon" href="./icons/tools/P0021.svg" />
    <link rel="stylesheet" href="/hub-boot.css" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        height: 100%;
      }
    </style>
    <title>AutoVideo Studio</title>
  </head>
  <body class="theme-hub m-0 h-full min-h-0 overflow-hidden">
    <div class="dot-grid-bg" aria-hidden></div>
    <div id="hub-boot-loader" class="hub-boot-loader--pane" role="status" aria-label="Loading AutoVideo Studio">
      <div class="hub-boot-orb" aria-hidden="true">
        <span class="hub-boot-orb__ring"></span>
        <span class="hub-boot-orb__ring hub-boot-orb__ring--dash"></span>
        <span class="hub-boot-orb__ring hub-boot-orb__ring--inner"></span>
        <span class="hub-boot-orb__core">
          <img src="./icons/tools/P0021.svg" alt="" width="20" height="20" decoding="async" />
        </span>
      </div>
    </div>
    <div id="root" class="relative h-full min-h-0"></div>
    <script src="/hub-boot-fallback.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
